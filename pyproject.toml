[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoexectool"
dynamic = ["version"]
description = "通用自动化任务编排执行工具 AutoExecTool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AutoExecTool" }]
dependencies = [
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "PyYAML>=6.0",
  "paramiko>=3.4",
  "pywinrm>=0.4.3",
  "httpx>=0.27",
  "cryptography>=42.0",
  "tzdata>=2024.1",
  "typer>=0.12",
  "rich>=13.0",
  "PySide6>=6.6",
  "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pyinstaller>=6.0",
]

[project.scripts]
autoexectool = "autoexectool.cli.main:main"

[project.gui-scripts]
autoexectool-gui = "autoexectool.app.main:run_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "autoexectool.__version__" }

[tool.setuptools.package-data]
autoexectool = ["ui/theme/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
